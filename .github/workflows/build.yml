name: Build OpenWrt

on:
  # 定时自动检查上游：取消下面两行注释即可开启（UTC 19:00 = 香港时间每天凌晨 3:00）
  # schedule:
  #   - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      devices:
        description: "要编译的机型"
        type: choice
        default: all
        options:
          - all
          - x86_64
          - athena
          - arthur
          - jd
      force:
        description: "上游没更新也强制编译（首次运行请勾选）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      immortal_sha: ${{ steps.cmp.outputs.immortal_sha }}
      libwrt_sha: ${{ steps.cmp.outputs.libwrt_sha }}
      tag: ${{ steps.cmp.outputs.tag }}
      matrix: ${{ steps.cmp.outputs.matrix }}
      devs: ${{ steps.cmp.outputs.devs }}
    steps:
      - name: 对比双上游提交与最新 Release
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DEVICES: ${{ inputs.devices || 'all' }}
        run: |
          IMMORTAL_URL="https://github.com/immortalwrt/immortalwrt.git"
          IMMORTAL_BRANCH="master"
          LIBWRT_URL="https://github.com/LiBwrt/LibWrt.git"
          LIBWRT_BRANCH="25.12-nss"

          IMM=$(git ls-remote "$IMMORTAL_URL" "refs/heads/$IMMORTAL_BRANCH" | cut -c1-12)
          LIB=$(git ls-remote "$LIBWRT_URL" "refs/heads/$LIBWRT_BRANCH" | cut -c1-12)
          if [ -z "$IMM" ] || [ -z "$LIB" ]; then
            echo "无法获取上游提交 ImmortalWrt=$IMM LibWrt=$LIB"
            exit 1
          fi

          # 选择机型：all=三台，jd=雅典娜+亚瑟，其余为单台
          case "$DEVICES" in
            all)    DEVS="x86_64 athena arthur" ;;
            jd)     DEVS="athena arthur" ;;
            x86_64|athena|arthur) DEVS="$DEVICES" ;;
            *) echo "未知机型选项：$DEVICES"; exit 1 ;;
          esac

          MATRIX='{"include":['
          SEP=""
          for d in $DEVS; do
            if [ "$d" = "x86_64" ]; then
              ITEM="{\"device\":\"x86_64\",\"repo_url\":\"$IMMORTAL_URL\",\"repo_branch\":\"$IMMORTAL_BRANCH\",\"config\":\"x86_64.config\"}"
            else
              ITEM="{\"device\":\"$d\",\"repo_url\":\"$LIBWRT_URL\",\"repo_branch\":\"$LIBWRT_BRANCH\",\"config\":\"$d.config\"}"
            fi
            MATRIX="$MATRIX$SEP$ITEM"
            SEP=","
          done
          MATRIX="$MATRIX]}"

          # 三台一起编用 build-<ImmortalWrt>-<LibWrt>；只编部分机型时 tag 末尾加机型，互不覆盖
          if [ "$DEVICES" = "all" ]; then
            TAG="build-${IMM}-${LIB}"
          else
            TAG="build-${IMM}-${LIB}-${DEVICES}"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS=yes
          else
            EXISTS=no
          fi

          echo "ImmortalWrt master: $IMM"
          echo "LibWrt 25.12-nss:   $LIB"
          echo "本次机型: $DEVS"
          echo "本次 tag: $TAG  已有同名 Release: $EXISTS"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "devs=$DEVS" >> "$GITHUB_OUTPUT"

          echo "immortal_sha=$IMM" >> "$GITHUB_OUTPUT"
          echo "libwrt_sha=$LIB" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ] || [ "$EXISTS" = "no" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    # 24.04 自带 clang 18：内核 6.18 的 bpf-headers 要求 clang >= 15，gn 要求支持 C++23，22.04 的 clang 14 都不行
    runs-on: ubuntu-24.04
    # actions: write 只用来删掉同机型过期的缓存（见最后的「清理旧缓存」）；发 Release 在 release job 里
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      # 和 OpenWrt rules.mk 的默认值一致（CONFIG_CCACHE_DIR 为空时就是 $(TOPDIR)/.ccache），显式写出来给 ccache 统计/设置用
      CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
      # 缓存键用本机型对应的上游短 SHA：x86_64 看 ImmortalWrt，雅典娜/亚瑟看 LibWrt（另一个上游变了不影响本机型的缓存）
      UPSTREAM_SHA: ${{ matrix.device == 'x86_64' && needs.check.outputs.immortal_sha || needs.check.outputs.libwrt_sha }}
    steps:
      - name: 记录开始时间
        # 「编译」一步据此算离 GitHub 6 小时上限还剩多少时间
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装依赖
        run: |
          echo "::group::apt 安装编译依赖"
          sudo apt-get update -y
          # 列表同 ImmortalWrt README（已适配 24.04：libncurses-dev、无 python3-distutils）；
          # clang / llvm / lld 给 eBPF 程序（daed、qosify 等）用，CONFIG_BPF_TOOLCHAIN_HOST 直接用宿主机的
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd python3-setuptools
          echo "::endgroup::"
          echo "::group::工具链版本"
          lsb_release -ds
          gcc --version | head -1
          clang --version
          ld.lld --version
          llvm-strip --version | head -2
          echo "::endgroup::"
          CLANG_MAJOR=$(clang -dumpversion | cut -d. -f1)
          if [ "$CLANG_MAJOR" -lt 15 ]; then
            echo "::error::宿主机 clang 版本 $CLANG_MAJOR 太旧，内核 bpf-headers 至少要 15"
            exit 1
          fi
          echo "clang $CLANG_MAJOR，满足 >= 15"
          df -h

      - name: 拉取上游源码
        run: |
          echo "克隆 ${{ matrix.repo_url }} 分支 ${{ matrix.repo_branch }} (${{ matrix.device }})"
          git clone --depth 1 -b "${{ matrix.repo_branch }}" "${{ matrix.repo_url }}" openwrt
          # files/common 给所有机型，files/<机型> 只给对应机型（例如 x86 的首次开机自动分区脚本）
          for d in files/common "files/${{ matrix.device }}"; do
            if [ -d "$d" ]; then
              mkdir -p openwrt/files
              cp -r "$d/." openwrt/files/
              echo "已复制自定义文件 $d"
            fi
          done

      # 本地编译后上传的缓存（scripts/pack-ci-cache.sh + upload-ci-cache.sh → 预发布 Release ci-cache-<机型>-<上游短SHA>）：
      # 优先级高于下面的 Actions 缓存。有上游 SHA 完全一致的就用它，否则用该机型最新的一个（增量）；没有就跳过。
      # 恢复了工具链就不再恢复 / 重复保存 Actions 的工具链缓存；ccache 会和 Actions 的 ccache 合并。
      - name: 恢复缓存：本地上传的 Release（ci-cache）
        id: relcache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-ci-cache.sh "${{ matrix.device }}" "$UPSTREAM_SHA" openwrt

      # 缓存分三份，键 = 种类-机型-上游短SHA，上游变了按机型回退到最近一份（相当于本地 git pull 后增量编译）：
      #   dl         源码包；下载完立刻保存
      #   toolchain  编译机工具 staging_dir/host + build_dir/host，交叉工具链 staging_dir/toolchain-* + build_dir/toolchain-*；
      #              build_dir 里有 .built 等完成标记，只缓存 staging_dir 的话 OpenWrt 还是会整套重编，所以两边都要；工具链编完立刻保存
      #   ccache     每次都会变，键末尾带 run_id；编译结束（成功、失败、主动超时停止）都存一份新的，并删掉同机型旧的
      # 用 cache/restore + cache/save 分开写，是因为 actions/cache 只在 job 成功时保存，超时失败就什么都存不下。
      - name: 恢复缓存：dl
        id: cache-dl
        if: steps.relcache.outputs.dl != 'true'
        uses: actions/cache/restore@v5
        with:
          path: openwrt/dl
          key: dl-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}
          restore-keys: dl-${{ matrix.device }}-

      - name: 恢复缓存：工具和工具链
        id: cache-toolchain
        if: steps.relcache.outputs.toolchain != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}
          restore-keys: toolchain-${{ matrix.device }}-

      - name: 恢复缓存：ccache
        id: cache-ccache
        uses: actions/cache/restore@v5
        with:
          path: openwrt/.ccache
          key: ccache-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}-
            ccache-${{ matrix.device }}-

      - name: 更新 feeds 并载入配置
        working-directory: openwrt
        run: |
          echo "::group::feeds update"
          ./scripts/feeds update -a
          echo "::endgroup::"
          # x86 额外插件（MosDNS、Tailscale 的 LuCI），只对 x86_64 生效，雅典娜/亚瑟不受影响
          if [ "${{ matrix.device }}" = "x86_64" ]; then
            echo "::group::x86_64 额外插件"
            bash ../scripts/x86_64-extra-packages.sh
            echo "::endgroup::"
          fi
          # feeds install -a 会刷几千行，写进文件（随日志一起上传），失败才打印末尾
          if ! ./scripts/feeds install -a > feeds-install.log 2>&1; then
            tail -n 100 feeds-install.log
            exit 1
          fi
          echo "feeds install 完成（$(wc -l < feeds-install.log) 行输出，见日志压缩包里的 feeds-install.log）"
          cp ../configs/${{ matrix.config }} .config
          make defconfig
          # 检查配置里写成 =y 的包在 defconfig 后都还在，缺了就直接失败，免得编完才发现少插件
          missing=$(grep -E '^CONFIG_[A-Za-z0-9_.+-]+=y$' ../configs/${{ matrix.config }} | while read -r l; do grep -qxF "$l" .config || echo "$l"; done)
          if [ -n "$missing" ]; then
            echo "以下选项在 make defconfig 后丢失："
            echo "$missing"
            # 目前只对 x86_64 严格检查，其他机型只提示
            if [ "${{ matrix.device }}" = "x86_64" ]; then
              exit 1
            fi
          fi
          # ccache：配置里要有 CONFIG_CCACHE=y；OpenWrt 默认上限 5G，整机编译会把前面的结果挤掉，调到 8G
          grep -qx 'CONFIG_CCACHE=y' .config || echo "::warning::.config 里没有 CONFIG_CCACHE=y，ccache 不会生效"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=8G
          ccache --zero-stats > /dev/null || true
          echo "Release 缓存：${{ steps.relcache.outputs.tag || '无' }}（toolchain=${{ steps.relcache.outputs.toolchain || 'false' }} ccache=${{ steps.relcache.outputs.ccache || 'false' }} dl=${{ steps.relcache.outputs.dl || 'false' }}）"
          echo "缓存命中：dl=${{ steps.cache-dl.outputs.cache-matched-key || '无' }}"
          echo "          toolchain=${{ steps.cache-toolchain.outputs.cache-matched-key || '无' }}"
          echo "          ccache=${{ steps.cache-ccache.outputs.cache-matched-key || '无' }}（$(du -sh "$CCACHE_DIR" | cut -f1)）"

      - name: 下载源码包
        working-directory: openwrt
        run: |
          # 输出写进 download.log，控制台只显示失败的包；失败时单线程重试一次
          if ! make download -j8 > download.log 2>&1; then
            echo "并行下载有失败，单线程重试："
            grep -E 'ERROR:' download.log || true
            if ! make download -j1 V=s > download-verbose.log 2>&1; then
              echo "::group::下载失败的包"
              grep -E 'ERROR:|No more mirrors|Download failed' download-verbose.log || true
              echo "::endgroup::"
              tail -n 60 download-verbose.log
              echo "::error::make download 失败，完整日志在 logs-${{ matrix.device }} 产物里"
              exit 1
            fi
          fi
          echo "下载完成，dl 目录 $(du -sh dl | cut -f1)"

      - name: 保存缓存：dl
        if: steps.cache-dl.outputs.cache-hit != 'true' && steps.relcache.outputs.dl != 'true'
        uses: actions/cache/save@v5
        with:
          path: openwrt/dl
          key: dl-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}

      - name: 编译工具和工具链
        id: toolchain
        working-directory: openwrt
        run: |
          # 先单独编 tools + toolchain，编完马上存缓存，后面整机编译超时也不影响这部分
          s=$(date +%s)
          if make tools/install toolchain/install -j"$(nproc)" BUILD_LOG=1 > toolchain.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "工具和工具链完成，用时 $(( ($(date +%s) - s) / 60 )) 分钟（命中缓存时只要几分钟）"
          else
            # 不在这里报错退出：交给下一步「编译」，失败时那边会 -j1 V=s 重试并输出详细日志
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::工具/工具链并行编译失败，交给「编译」一步重试"
            grep -E 'ERROR:' toolchain.log || true
          fi

      - name: 保存缓存：工具和工具链
        # Release 里上游 SHA 完全一致的工具链不再存一份；不一致（增量重编过）才存
        if: >-
          steps.toolchain.outputs.ok == 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' &&
          !(steps.relcache.outputs.toolchain == 'true' && steps.relcache.outputs.exact == 'true')
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}

      - name: 编译
        working-directory: openwrt
        run: |
          # 完整输出只进 build.log（随日志产物上传），控制台只留每个包的进度行和报错行，避免网页日志太大打不开。
          # BUILD_LOG=1：每个包的编译输出另存到 openwrt/logs/<包路径>/compile.txt，失败的包写 error.txt
          FILTER='^ make\[[0-9]+\] |ERROR:|^make\[[0-9]+\]: \*\*\*|^make: \*\*\*'
          # GitHub 单个 job 最多 6 小时，到点直接被杀，后面的保存缓存、上传日志都不会执行。
          # 所以从 job 开始算 335 分钟就主动停掉 make，留约 25 分钟保存 ccache 和上传日志；再跑一次会用缓存接着编，快很多。
          DEADLINE=$(( JOB_START + 335 * 60 ))
          left() { echo $(( (DEADLINE - $(date +%s)) / 60 )); }
          timed_out() {
            echo "::error::离 GitHub 6 小时上限太近，主动停止编译。已编好的部分在 ccache 缓存里，再 Run workflow 一次会快很多"
            {
              echo "### ${{ matrix.device }} 编译时间不够，已主动停止"
              echo "已编好的部分存进了 ccache 缓存，重新运行一次即可（第二次会快很多）。完整日志见 \`logs-${{ matrix.device }}\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [ "$(left)" -gt 5 ] || timed_out
          echo "开始编译：$(nproc) 线程，$(date '+%F %T %Z')，最多还能编 $(left) 分钟"
          set +e
          timeout -k 2m "$(left)m" make -j"$(nproc)" BUILD_LOG=1 2>&1 | tee build.log | grep --line-buffered -E "$FILTER"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "编译成功：$(date '+%F %T %Z')"
            exit 0
          fi
          { [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; } && timed_out

          if [ "$(left)" -le 10 ]; then
            echo "::warning::并行编译失败（退出码 $rc），剩余时间不够 -j1 重试，直接输出报错"
            cp build.log build-verbose.log
          else
            echo "::warning::并行编译失败（退出码 $rc），用 make -j1 V=s 重试（最多 $(left) 分钟），详细输出写进 build-verbose.log"
            set +e
            timeout -k 2m "$(left)m" make -j1 V=s BUILD_LOG=1 > build-verbose.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "单线程重试成功（并行编译偶发失败）"
              exit 0
            fi
            { [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; } && timed_out
          fi

          echo "::group::编译失败的包"
          grep -hE 'ERROR: .* failed to build' build.log build-verbose.log | sort -u || true
          echo "::endgroup::"
          echo "::group::logs/ 里的 error.txt"
          find logs -name error.txt -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; 2>/dev/null || true
          echo "::endgroup::"
          # 优先定位第一个 "ERROR: ... failed to build"，往前多给一些行；找不到再找第一个 error: / Error N
          first=$(grep -nE 'ERROR: .* failed to build' build-verbose.log | head -n 1 | cut -d: -f1)
          before=80
          if [ -z "$first" ]; then
            first=$(grep -nE 'error:|Error [0-9]+' build-verbose.log | head -n 1 | cut -d: -f1)
            before=30
          fi
          if [ -n "$first" ]; then
            echo "::group::第一个报错前后（build-verbose.log 第 $first 行）"
            start=$(( first > before ? first - before : 1 ))
            sed -n "${start},$(( first + 10 ))p" build-verbose.log
            echo "::endgroup::"
          fi
          echo "===== build-verbose.log 最后 200 行 ====="
          tail -n 200 build-verbose.log
          {
            echo "### ${{ matrix.device }} 编译失败"
            echo '```'
            grep -hE 'ERROR: .* failed to build' build.log build-verbose.log | sort -u || true
            echo '```'
            echo "完整日志：本次运行页面底部 Artifacts 里的 \`logs-${{ matrix.device }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::编译失败，完整日志在 logs-${{ matrix.device }} 产物里"
          exit 1

      - name: ccache 统计
        if: always() && steps.cache-ccache.outcome == 'success'
        working-directory: openwrt
        run: |
          [ -d "$CCACHE_DIR" ] || { echo "没有 ccache 目录"; exit 0; }
          # 优先用 OpenWrt 自己编的 ccache（编译时用的就是它），没有就用系统的
          CCACHE=ccache
          [ -x staging_dir/host/bin/ccache ] && CCACHE=staging_dir/host/bin/ccache
          "$CCACHE" --show-stats || true
          echo "ccache 目录大小：$(du -sh "$CCACHE_DIR" | cut -f1)"

      - name: 保存缓存：ccache
        id: save-ccache
        if: always() && steps.cache-ccache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: openwrt/.ccache
          key: ccache-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 清理旧缓存
        # 仓库缓存总共约 10GB，超了 GitHub 会按「最久没用」自动删。这里主动删掉同机型过期的：
        # 当前这份已经存在时，删掉同种类同机型的其他份（ccache 每次一份新的，不删会很快占满）
        if: always() && steps.cache-ccache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEV: ${{ matrix.device }}
          CCACHE_KEY: ccache-${{ matrix.device }}-${{ env.UPSTREAM_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for kind in dl toolchain ccache; do
            if [ "$kind" = ccache ]; then cur="$CCACHE_KEY"; else cur="$kind-$DEV-$UPSTREAM_SHA"; fi
            keys=$(gh cache list --repo "$REPO" --key "$kind-$DEV-" --limit 100 --json key --jq '.[].key' || true)
            if ! printf '%s\n' "$keys" | grep -qxF "$cur"; then
              echo "$kind：当前这份（$cur）没存上，保留旧的"
              continue
            fi
            { printf '%s\n' "$keys" | grep -vxF "$cur" || true; } | while read -r k; do
              [ -n "$k" ] || continue
              echo "删除旧缓存 $k"
              gh cache delete "$k" --repo "$REPO" || true
            done
          done
          echo "::group::本仓库现有缓存"
          gh cache list --repo "$REPO" --limit 100 || true
          echo "::endgroup::"

      - name: 整理产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -type f \( -name '*.img.gz' -o -name '*.bin' -o -name '*.itb' \
            -o -name '*.ubi' -o -name 'sha256sums' -o -name '*.manifest' \) -exec cp {} out/ \;
          ls -lh out
          df -h

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.device }}
          path: out/

      - name: 打包编译日志
        if: always()
        run: |
          [ -d openwrt ] || exit 0
          cd openwrt
          files=""
          for f in toolchain.log build.log build-verbose.log download.log download-verbose.log feeds-install.log .config logs; do
            [ -e "$f" ] && files="$files $f"
          done
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            tar -czf ../build-logs-${{ matrix.device }}.tar.gz $files
            ls -lh ../build-logs-${{ matrix.device }}.tar.gz
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.device }}
          path: build-logs-${{ matrix.device }}.tar.gz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: fw

      - name: 检查所选机型产物并避免同名文件冲突
        run: |
          # 编译日志（logs-<机型>）不放进 Release
          rm -rf fw/logs-*
          for dev in ${{ needs.check.outputs.devs }}; do
            if [ ! -d "fw/$dev" ] || [ -z "$(ls -A "fw/$dev")" ]; then
              echo "缺少 $dev 的产物"
              exit 1
            fi
          done
          for d in fw/*/; do
            dev=$(basename "$d")
            if [ -f "$d/sha256sums" ]; then
              mv "$d/sha256sums" "$d/sha256sums-$dev"
            fi
          done
          ls -lR fw

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.devs }} | ImmortalWrt ${{ needs.check.outputs.immortal_sha }} / LibWrt ${{ needs.check.outputs.libwrt_sha }}
          body: |
            本次编译机型：`${{ needs.check.outputs.devs }}`（下面只有本次编译的机型有产物）
            - **x86_64**：ImmortalWrt `master` @ `${{ needs.check.outputs.immortal_sha }}`
            - **雅典娜 AX6600**（`jdcloud_re-cs-02`）：LibWrt `25.12-nss` @ `${{ needs.check.outputs.libwrt_sha }}`（满血 NSS）
            - **亚瑟 AX1800 Pro**（`jdcloud_re-ss-01`）：LibWrt `25.12-nss` @ `${{ needs.check.outputs.libwrt_sha }}`（满血 NSS）
            - 文件名里带 device id，刷机前务必核对型号；校验文件为 `sha256sums-<机型>`
          files: fw/**/*
          fail_on_unmatched_files: true
